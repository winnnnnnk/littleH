name: Cross-platform

on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Syntax, manifests, contracts, and unit tests
        shell: bash
        run: |
          python -m compileall -q plugins/xiaoh tests
          for file in \
            .agents/plugins/marketplace.json \
            plugins/xiaoh/.codex-plugin/plugin.json \
            plugins/xiaoh/dependencies.json \
            plugins/xiaoh/managed-automations.json \
            plugins/xiaoh/install-manifest.json \
            plugins/xiaoh/third_party/mattpocock-skills/manifest.json \
            plugins/xiaoh/runtime/codex/agent-system/*.json; do
            python -m json.tool "$file" >/dev/null
          done
          python plugins/xiaoh/runtime/codex/agent-system/validate.py --self-test
          python plugins/xiaoh/runtime/codex/hooks/block_reserved_root_agent.py --self-test
          python plugins/xiaoh/runtime/codex/hooks/guard_vault_writes.py --self-test
          python plugins/xiaoh/scripts/xiaoh.py companions --json >/dev/null
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Isolated transaction, idempotency, and static Doctor
        shell: bash
        run: |
          ci_root="$RUNNER_TEMP/xiaoh 4.0 路径"
          mkdir -p "$ci_root/vault/.obsidian"
          python plugins/xiaoh/scripts/xiaoh.py setup \
            --codex-home "$ci_root/codex" \
            --vault "$ci_root/vault" \
            --config "$ci_root/xiaoh/config.json" \
            --active-skill-root "$PWD/plugins/xiaoh/skills/xiaoh-setup" \
            --json > "$ci_root/setup.json"
          python plugins/xiaoh/scripts/xiaoh.py update \
            --codex-home "$ci_root/codex" \
            --vault "$ci_root/vault" \
            --config "$ci_root/xiaoh/config.json" \
            --active-skill-root "$PWD/plugins/xiaoh/skills/xiaoh-update" \
            --json > "$ci_root/update.json"
          set +e
          python plugins/xiaoh/scripts/xiaoh.py doctor \
            --codex-home "$ci_root/codex" \
            --vault "$ci_root/vault" \
            --config "$ci_root/xiaoh/config.json" \
            --active-skill-root "$PWD/plugins/xiaoh/skills/xiaoh-doctor" \
            --json > "$ci_root/doctor.json"
          doctor_status=$?
          set -e
          python - "$ci_root" "$doctor_status" <<'PY'
          import json
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          setup = json.loads((root / "setup.json").read_text(encoding="utf-8"))
          update = json.loads((root / "update.json").read_text(encoding="utf-8"))
          doctor = json.loads((root / "doctor.json").read_text(encoding="utf-8"))
          assert setup["status"] == "passed" and setup["phase"] == "committed", setup
          assert setup["version"] == "4.0.0", setup
          assert setup["recovery"]["complete"] is True, setup
          assert setup["activation_state"] == "runtime_unverified", setup
          assert update["status"] == "passed" and update["actual_writes"] == [], update
          expected = {
              "plugin", "skill-governance", "loaded-skill", "managed-runtime",
              "agents", "hooks", "validator", "vault", "workspace",
              "automation", "playbook",
          }
          assert {item["diagnostic_id"] for item in doctor["diagnostics"]} == expected, doctor
          assert doctor["errors"] == [], doctor
          assert doctor["activation_state"] == "runtime_unverified", doctor
          assert int(sys.argv[2]) != 0, "degraded static Doctor must return non-zero"
          PY

      - name: Validate platform entrypoints
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            bash -n install.sh verify.sh
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell.exe -NoProfile -Command '
              $failed = $false
              @("install.ps1", "verify.ps1", "plugins/xiaoh/runtime/codex/hooks/block_reserved_root_agent.ps1") | ForEach-Object {
                $tokens = $null; $errors = $null
                [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $_), [ref]$tokens, [ref]$errors) | Out-Null
                if ($errors.Count -gt 0) { $failed = $true; $errors | ForEach-Object { Write-Error $_.Message } }
              }
              if ($failed) { exit 1 }
            '
          fi

  quality:
    name: Coverage / typing / lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install development-only quality tools
        run: python -m pip install "coverage>=7,<8" "mypy>=1,<2" "ruff>=0.11,<1"

      - name: Coverage
        run: |
          python -m coverage run --branch -m unittest discover -s tests -p 'test_*.py'
          python -m coverage report

      - name: Static typing
        run: |
          python -m mypy \
            --ignore-missing-imports \
            --allow-untyped-defs \
            plugins/xiaoh/xiaoh_runtime \
            plugins/xiaoh/runtime/codex/agent-system/xiaoh_security \
            plugins/xiaoh/runtime/codex/agent-system/xiaoh_validator

      - name: Lint
        run: python -m ruff check --select E9,F63,F7,F82 plugins/xiaoh tests
