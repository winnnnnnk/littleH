# xiaoh-root-agent-hook:start
[[hooks.PreToolUse]]
matcher = "^(Agent|spawn_agent)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "__CODEX_HOME__/hooks/block_reserved_root_agent.py" --config "__XIAOH_CONFIG__"'
command_windows = '"__PYTHON_WINDOWS__" "__CODEX_HOME__/hooks/block_reserved_root_agent.py" --config "__XIAOH_CONFIG__"'
timeout = 20
statusMessage = "校验 Agent 委派上下文与角色权限"

[[hooks.PreToolUse]]
matcher = "^(apply_patch|exec_command)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "__CODEX_HOME__/hooks/guard_vault_writes.py" --config "__XIAOH_CONFIG__"'
command_windows = 'py -3 "__CODEX_HOME__/hooks/guard_vault_writes.py" --config "__XIAOH_CONFIG__"'
timeout = 10
statusMessage = "校验xiaoh Obsidian Vault写入路径"

[[hooks.SubagentStart]]
matcher = ".*"

[[hooks.SubagentStart.hooks]]
type = "command"
command = 'python3 "__CODEX_HOME__/hooks/block_reserved_root_agent.py" --config "__XIAOH_CONFIG__" --subagent-start'
command_windows = '"__PYTHON_WINDOWS__" "__CODEX_HOME__/hooks/block_reserved_root_agent.py" --config "__XIAOH_CONFIG__" --subagent-start'
timeout = 20
statusMessage = "绑定专业 Agent 运行身份与任务上下文"

[[hooks.SubagentStop]]
matcher = ".*"

[[hooks.SubagentStop.hooks]]
type = "command"
command = 'python3 "__CODEX_HOME__/hooks/block_reserved_root_agent.py" --config "__XIAOH_CONFIG__" --subagent-stop'
command_windows = '"__PYTHON_WINDOWS__" "__CODEX_HOME__/hooks/block_reserved_root_agent.py" --config "__XIAOH_CONFIG__" --subagent-stop'
timeout = 20
statusMessage = "认证专业 Agent 有效委派回执"
# xiaoh-root-agent-hook:end
